# Match the five document plugins enabled by the normal `codex` configuration.
# Superpowers and HyperFrames remain provider-on-demand and are intentionally
# absent here.
[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true
